name: "IaC Security & Policy Gate"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  checkov-static-analysis:
    name: "Checkov Static Analysis Gate"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Checkov
        run: pip install --upgrade checkov

      - name: Run Focused Checkov Security Group Ingress Scan
        run: |
          checkov -d terraform/ \
            --framework terraform \
            --check CKV_AWS_24,CKV_AWS_25,CKV_AWS_260,CKV_AWS_277 \
            --compact

  opa-conftest-gate:
    name: "OPA / Conftest Policy Enforcement Gate"
    needs: [checkov-static-analysis]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Conftest CLI
        run: |
          wget -q https://github.com/open-policy-agent/conftest/releases/download/v0.50.0/conftest_0.50.0_Linux_x86_64.tar.gz
          tar xzf conftest_0.50.0_Linux_x86_64.tar.gz
          sudo mv conftest /usr/local/bin/
          conftest --version

      - name: Execute OPA Conftest Policy Check
        run: |
          conftest test terraform/ --policy policy/security_group.rego
