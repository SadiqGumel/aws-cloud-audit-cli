name: "IaC Security & Policy Gate"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  checkov-static-analysis:
    name: "Checkov Static Analysis Gate"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Checkov Static Analysis
        uses: bridgecrewio/checkov-action@master
        with:
          directory: "terraform/"
          framework: "terraform"
          output_format: "cli"
          soft_fail: false
          skip_check: "CKV_AWS_18,CKV_AWS_45,CKV_AWS_144,CKV2_AWS_5,CKV2_AWS_61,CKV2_AWS_62"

  opa-conftest-gate:
    name: "OPA / Conftest Policy Enforcement Gate"
    needs: [checkov-static-analysis]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Conftest CLI
        run: |
          wget -q https://github.com/open-policy-agent/conftest/releases/download/v0.50.0/conftest_0.50.0_Linux_x86_64.tar.gz
          tar xzf conftest_0.50.0_Linux_x86_64.tar.gz
          sudo mv conftest /usr/local/bin/
          conftest --version

      - name: Execute OPA Conftest Policy Check
        run: |
          conftest test terraform/ --policy policy/security_group.rego
