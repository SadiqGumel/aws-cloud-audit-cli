name: IaC Security Scan Guardrail & OPA Gate

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'terraform/**'
      - 'policy/**'
      - '**.tf'
  push:
    branches:
      - main
    paths:
      - 'terraform/**'
      - 'policy/**'
      - '**.tf'

permissions:
  contents: read
  pull-requests: write

jobs:
  checkov-guardrail:
    name: Checkov Static Analysis Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Checkov Engine
        run: |
          python -m pip install --upgrade pip
          pip install checkov

      - name: Execute Checkov IaC Scan (Hard Gate)
        id: checkov_scan
        run: |
          checkov -d ./terraform/ \
            --framework terraform \
            --compact \
            --check HIGH,CRITICAL \
            --output cli

  opa-conftest-gate:
    name: OPA / Conftest Policy Enforcement Gate
    runs-on: ubuntu-latest
    needs: checkov-guardrail
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Conftest CLI
        run: |
          CONFTEST_VERSION="0.50.0"
          curl -LO "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz"
          tar xzf "conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz"
          sudo mv conftest /usr/local/bin/
          conftest --version

      - name: Execute OPA Rego Evaluation on HCL
        run: |
          conftest test ./terraform/main.tf \
            --policy ./policy \
            --namespace terraform.security
